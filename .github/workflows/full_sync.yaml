name: Full Sync
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  initial-sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone Full Advisory DB and Process
        run: |
          set -euo pipefail

          cleanup() {
            rm -rf temp_data
          }
          trap cleanup EXIT

          NEW_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          git clone --depth 1 https://github.com/github/advisory-database.git temp_data

          python3 sync_advisories.py temp_data/advisories

          rm -rf temp_data

          echo "$NEW_TIMESTAMP" > last_sync_timestamp.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Initial sync: Full GHSA advisory import"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Stage JSON Files and 404 Page
        run: |
          set -euo pipefail
          rm -rf pages_build
          mkdir -p pages_build

          # Copy only .json files while preserving directory paths; exclude build/temp dirs
          find . \
            -path './.git' -prune -o \
            -path './.github' -prune -o \
            -path './pages_build' -prune -o \
            -path './temp_data' -prune -o \
            -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
              rel="${file#./}"
              mkdir -p "pages_build/$(dirname "$rel")"
              cp "$file" "pages_build/$rel"
            done

          cat <<'EOF' > pages_build/404.html
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>404 - Not Found</title>
          </head>
          <body>
            <h1>404 - Not Found</h1>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
